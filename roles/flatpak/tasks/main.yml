---
# Flatpak role - Migrate from Fedora flatpaks to Flathub

- name: Gather system facts
  ansible.builtin.setup:

- name: Check if system is Fedora
  ansible.builtin.set_fact:
    is_fedora: "{{ ansible_facts.distribution == 'Fedora' }}"

- name: Get list of flatpak remotes
  ansible.builtin.command:
    cmd: flatpak remotes --columns=name
  register: flatpak_remotes
  changed_when: false
  failed_when: false

- name: Check if Fedora flatpaks remote exists
  ansible.builtin.set_fact:
    has_fedora_remote: "{{ fedora_flatpaks_remote in flatpak_remotes.stdout_lines }}"
  when: flatpak_remotes.rc == 0

- name: Set has_fedora_remote to false if flatpak command failed
  ansible.builtin.set_fact:
    has_fedora_remote: false
  when: flatpak_remotes.rc != 0

- name: Display flatpak migration status
  ansible.builtin.debug:
    msg: "Fedora flatpaks remote is {{ 'detected - will migrate to Flathub' if (is_fedora and has_fedora_remote) else 'not found' }}"

- name: Check if Flathub remote exists
  ansible.builtin.set_fact:
    has_flathub_remote: "{{ 'flathub' in flatpak_remotes.stdout_lines }}"
  when: flatpak_remotes.rc == 0

- name: Set has_flathub_remote to false if flatpak command failed
  ansible.builtin.set_fact:
    has_flathub_remote: false
  when: flatpak_remotes.rc != 0

- name: Add Flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-add --if-not-exists flathub "{{ flathub_url }}"
  when: is_fedora and has_fedora_remote and not has_flathub_remote

- name: Reinstall Fedora flatpaks from Flathub
  ansible.builtin.shell:
    cmd: flatpak install -y --reinstall flathub $(flatpak list --app-runtime=org.fedoraproject.Platform --columns=application | tail -n +1)
  when: is_fedora and has_fedora_remote
  register: reinstall_result
  changed_when: reinstall_result.rc == 0
  failed_when: false

- name: Display installation results
  ansible.builtin.debug:
    var: reinstall_result.stdout_lines
  when:
    - reinstall_result is defined
    - reinstall_result.stdout_lines is defined

- name: Remove Fedora flatpaks remote
  ansible.builtin.command:
    cmd: flatpak remote-delete -y "{{ fedora_flatpaks_remote }}"
  when: is_fedora and has_fedora_remote
  register: remote_delete_result
  failed_when: false

- name: Display success message
  ansible.builtin.debug:
    msg: |
      Flatpak migration completed successfully!

      Migrated applications from Fedora remote to Flathub
      Removed Fedora flatpaks remote

      All flatpaks are now using Flathub as their source.
  when: is_fedora and has_fedora_remote
