#
# tuned configuration - HP OmniBook Ultra Flip 14 (board 8CDE, Lunar Lake-M)
# Managed by Ansible - roles/omnibook
#
# Inherits from 'balanced' directly (not 'balanced-battery') to avoid a
# circular include since this file *is* the balanced-battery override.
#

[main]
summary=Balanced battery with OmniBook Lunar Lake power tuning
include=balanced

[cpu]
energy_performance_preference=balance_power
boost=1

[video]
panel_power_savings=3

[sysctl]
vm.laptop_mode=5
vm.dirty_writeback_centisecs=1500
kernel.nmi_watchdog=0

[script]
script=${i:PROFILE_DIR}/script.sh
